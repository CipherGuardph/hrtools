<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YukiHR Tools</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #647168;
      --line: #dce5df;
      --bg: #f5f7f2;
      --panel: #ffffff;
      --teal: #2f8074;
      --lime: #bfe7d0;
      --amber: #f2bf61;
      --coral: #e9786d;
      --blue: #5d8fc8;
      --shadow: 0 22px 55px rgba(30, 44, 35, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(191, 231, 208, 0.42), transparent 38%),
        linear-gradient(315deg, rgba(93, 143, 200, 0.18), transparent 34%),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px clamp(18px, 5vw, 64px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.15rem;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--teal), var(--amber));
      color: #fff;
      box-shadow: 0 10px 24px rgba(47, 128, 116, 0.25);
    }

    .button {
      min-height: 42px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 800;
      border: 1px solid var(--teal);
      background: var(--teal);
      color: #fff;
      padding: 0 14px;
      box-shadow: 0 2px 0 rgba(23, 33, 27, 0.04);
    }

    .button {
      min-height: 52px;
      padding: 0 18px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 860px);
      align-items: center;
      justify-content: center;
      padding: 26px clamp(18px, 5vw, 64px) 58px;
    }

    .copy {
      max-width: 760px;
      text-align: center;
      justify-self: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 7vw, 7.4rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .lead {
      margin: 22px 0 0;
      max-width: 660px;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.22rem);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .footer {
      padding: 0 18px 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    @media (max-width: 960px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .button {
        width: 100%;
      }

    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="./index.html">
        <span class="mark">HR</span>
        <span>YukiHR Tools</span>
      </a>
    </header>

    <main class="hero">
      <section class="copy" aria-label="Home introduction">
        <h1>YukiHR Tools</h1>
        <div class="actions">
          <a class="button" href="./word-to-pdf-convert/index.html">PDF to Word converter</a>
          <a class="button" href="./merge-pdf/index.html">Merge PDF</a>
          <a class="button" href="./ocr-extract/index.html">Image to Text</a>
          <a class="button" href="./applicant-intake/index.html">Instant Applicant Analyzer</a>
        </div>
      </section>

    </main>

    <footer class="footer" data-global-footer></footer>
  </div>
  <script src="./footer.js"></script>
</body>
</html>
