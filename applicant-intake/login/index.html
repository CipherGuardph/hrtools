<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instant Applicant Analyzer Login</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #66726a;
      --line: #dbe4dd;
      --bg: #f6f8f4;
      --panel: #ffffff;
      --teal: #2f8174;
      --mint: #c7ecd7;
      --amber: #f3c25d;
      --shadow: 0 18px 45px rgba(38, 58, 45, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(199, 236, 215, 0.4), transparent 18%), var(--bg);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(16px, 4vw, 32px);
      background: #17211b;
      color: #fff;
    }

    .brand, .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--mint), var(--amber));
      color: #17211b;
    }

    .back {
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 0 12px;
      color: #eef6ef;
    }

    .shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 40px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.8rem);
      line-height: 0.96;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .badge {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      width: fit-content;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .wide { grid-column: 1 / -1; }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .notice {
      border-left: 5px solid var(--teal);
      background: #edf7f0;
      color: #245f4d;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.55;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .back, .btn {
        width: 100%;
        justify-content: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/applicant-intake/">
      <span class="mark">IN</span>
      <span>Analyzer Login</span>
    </a>
    <a class="back" href="/applicant-intake/">Back to Intake</a>
  </header>

  <main class="shell">
    <section class="panel">
      <span class="badge">Firebase sign-in</span>
      <h1>Login for Instant Applicant Analyzer</h1>
      <p class="lead">Use your Firebase auth account to open the recruiter dashboard. The project config is loaded from `config.js`.</p>

      <div class="form-grid">
        <label class="wide">Email<input id="email" type="email" placeholder="admin@example.com"></label>
        <label class="wide">Password<input id="password" type="password" placeholder="••••••••"></label>
      </div>

      <div class="button-row">
        <button class="btn primary" id="signInBtn" type="button">Sign In</button>
          <a class="btn" href="/applicant-intake/register/?next=/applicant-intake/dashboard/">Create Account</a>
      </div>

      <div class="notice" id="statusBox">Add Firebase config, save it once, then sign in with your admin account.</div>
    </section>
  </main>

  <script src="../config.js"></script>
  <script src="../shared.js"></script>
  <script>
    const el = id => document.getElementById(id);
    const nextUrl = new URLSearchParams(window.location.search).get("next") || "/applicant-intake/dashboard/";

    async function signIn() {
      try {
        const config = IntakeShared.getFirebaseConfig();
        if (!config || !config.apiKey || !config.projectId || !config.appId) {
          throw new Error("Firebase config is missing from config.js.");
        }
        window.__FIREBASE_CONFIG__ = config;
        const services = await IntakeShared.connectFirebase(config, { useDatabase: false });
        await services.auth.signInWithEmailAndPassword(el("email").value.trim(), el("password").value);
        window.location.href = nextUrl;
      } catch (error) {
        el("statusBox").textContent = `Sign in failed: ${error.message}`;
      }
    }

    el("signInBtn").addEventListener("click", signIn);
    const config = IntakeShared.getFirebaseConfig();
    el("statusBox").textContent = config && config.apiKey
      ? "Firebase config loaded from config.js. You can sign in now."
      : "Firebase config is missing. Add it to config.js before signing in.";
  </script>
</body>
</html>
