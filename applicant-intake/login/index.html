<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instant Applicant Analyzer Login</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #66726a;
      --line: #dbe4dd;
      --bg: #f6f8f4;
      --panel: #ffffff;
      --teal: #2f8174;
      --mint: #c7ecd7;
      --amber: #f3c25d;
      --shadow: 0 18px 45px rgba(38, 58, 45, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(199, 236, 215, 0.4), transparent 18%), var(--bg);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(16px, 4vw, 32px);
      background: #17211b;
      color: #fff;
    }

    .brand, .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--mint), var(--amber));
      color: #17211b;
    }

    .back {
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 0 12px;
      color: #eef6ef;
    }

    .shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 40px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.8rem);
      line-height: 0.96;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .badge {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      width: fit-content;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .wide { grid-column: 1 / -1; }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .notice {
      border-left: 5px solid var(--teal);
      background: #edf7f0;
      color: #245f4d;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.55;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .back, .btn {
        width: 100%;
        justify-content: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../index.html">
      <span class="mark">IN</span>
      <span>Analyzer Login</span>
    </a>
    <a class="back" id="backToIntakeLink" href="../index.html">Back to Intake</a>
  </header>

  <main class="shell">
    <section class="panel">
      <span class="badge">Secure HR access</span>
      <h1>Login for Instant Applicant Analyzer</h1>
      <p class="lead">Sign in with the local admin credentials to open the recruiter dashboard and manage applicant intake.</p>

      <div class="form-grid">
        <label class="wide">Username<input id="username" type="text" value="admin" placeholder="admin" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <label class="wide">Password<input id="password" type="password" value="admin" placeholder="admin" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      </div>

      <div class="button-row">
        <button class="btn primary" id="signInBtn" type="button">Sign In</button>
      </div>

      <div class="notice" id="statusBox">Use username `admin` and password `admin` to continue into the dashboard.</div>
    </section>
  </main>
  <script>
    const el = id => document.getElementById(id);
    const isFileProtocol = window.location.protocol === "file:";
    const routeFor = (serverPath, filePath) => (isFileProtocol ? new URL(filePath, window.location.href).toString() : serverPath);
    const appRoot = routeFor("/applicant-intake/", "../");
    function resolveNextTarget(raw) {
      const fallback = routeFor("/applicant-intake/dashboard/", "../dashboard/index.html");
      const next = String(raw || "").trim();
      if (!next) return fallback;
      if (!isFileProtocol) return next;
      if (next.startsWith("file:")) return next;
      if (next.startsWith("/applicant-intake/")) {
        return new URL(next.replace(/^\/applicant-intake\//, ""), appRoot).toString();
      }
      if (next.startsWith("./") || next.startsWith("../") || !next.includes("://")) {
        const normalized = next.replace(/^(\.\.\/|\.\/)+/, "");
        return new URL(normalized || "dashboard/index.html", appRoot).toString();
      }
      return next;
    }
    const nextUrl = resolveNextTarget(new URLSearchParams(window.location.search).get("next"));
    el("backToIntakeLink").href = routeFor("/applicant-intake/", "../index.html");
    const localSessionKey = "hrtools_applicant_intake_local_session";

    function setSession() {
      sessionStorage.setItem(localSessionKey, JSON.stringify({
        username: "admin",
        signedInAt: new Date().toISOString(),
      }));
    }

    function isSignedIn() {
      try {
        const raw = sessionStorage.getItem(localSessionKey);
        const data = raw ? JSON.parse(raw) : null;
        return data && data.username === "admin";
      } catch {
        return false;
      }
    }

    function signIn() {
      const username = el("username").value.trim().toLowerCase();
      const password = el("password").value.trim();
      if (username !== "admin" || password !== "admin") {
        el("statusBox").textContent = "Sign in failed: use admin / admin.";
        return;
      }
      setSession();
      window.location.href = nextUrl;
    }

    ["username", "password"].forEach(id => {
      el(id).addEventListener("focus", event => event.target.select());
    });
    el("signInBtn").addEventListener("click", signIn);
    if (isSignedIn()) {
      window.location.href = resolveNextTarget(nextUrl);
    }
  </script>
  <script src="../../footer.js"></script>
</body>
</html>
