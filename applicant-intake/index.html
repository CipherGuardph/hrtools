<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instant Applicant Analyzer</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #66726a;
      --line: #dbe4dd;
      --bg: #f6f8f4;
      --panel: #ffffff;
      --teal: #2f8174;
      --mint: #c7ecd7;
      --amber: #f3c25d;
      --shadow: 0 18px 45px rgba(38, 58, 45, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(199, 236, 215, 0.42), transparent 18%), var(--bg);
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px clamp(18px, 5vw, 64px);
      background: #17211b;
      color: #fff;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--teal), var(--amber));
      color: #fff;
    }

    .hero {
      display: grid;
      place-items: center;
      padding: 34px clamp(18px, 5vw, 64px) 56px;
    }

    .panel {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 34px);
      display: grid;
      gap: 18px;
      text-align: center;
    }

    .badge {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      width: fit-content;
      justify-self: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 7vw, 6rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .lead {
      margin: 0 auto;
      max-width: 640px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.04rem;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .button {
      min-height: 46px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 900;
      border: 1px solid var(--teal);
      background: var(--teal);
      color: #fff;
      padding: 0 18px;
    }

    .button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }

    @media (max-width: 620px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .actions {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
    <a class="brand" href="../index.html">
        <span class="mark">AI</span>
        <span>Instant Applicant Analyzer</span>
      </a>
    </header>

    <main class="hero">
      <section class="panel" aria-label="Authentication entry">
        <span class="badge">Secure access</span>
        <h1>Instant Applicant Analyzer</h1>
        <p class="lead">Use your HR account to open the analyzer, create a new account, and manage applicant intake from one place.</p>
        <div class="actions">
          <a class="button" href="./login/index.html?next=/applicant-intake/dashboard/">Login</a>
          <a class="button secondary" href="./register/index.html?next=/applicant-intake/dashboard/">Create Account</a>
        </div>
        <p class="hint">Use `admin` / `admin` to open the dashboard in this local build.</p>
      </section>
    </main>
  </div>
  <script src="../footer.js"></script>
</body>
</html>
